<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deliberate</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0.9;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      .hud-label {
        color: #7d8b99;
        display: inline-block;
        min-width: 66px;
      }
      .hud-hint {
        color: #9fd0ff;
      }
      .hud-error {
        color: #ff8a7a;
      }
      #deliberate {
        position: fixed;
        right: 12px;
        top: 12px;
        width: 280px;
        /* The model writes as much prose as it likes. Without a ceiling the panel grows past the
           viewport and pushes GO off the bottom of the screen, which is unreachable rather than
           merely ugly. Bound the panel, and let the text blocks inside it scroll. */
        max-height: calc(100vh - 24px);
        display: flex;
        flex-direction: column;
        font-size: 13px;
        line-height: 1.5;
        color: #e6e6e6;
        background: rgba(11, 13, 16, 0.82);
        border: 1px solid #1e2733;
        border-radius: 8px;
        padding: 10px 12px;
        text-shadow: 0 1px 2px #000;
      }
      #deliberate .dl-toggle {
        display: block;
        color: #7d8b99;
        cursor: pointer;
        user-select: none;
      }
      #deliberate:not(.dl-open) .dl-staged,
      #deliberate:not(.dl-open) .dl-preview,
      #deliberate:not(.dl-open) .dl-reactions,
      #deliberate:not(.dl-open) .dl-narration,
      #deliberate:not(.dl-open) #go {
        display: none;
      }
      /* Free player text. Hidden with the rest of the panel when deliberate mode is off, because
         words only mean something when the game master is being consulted. */
      #deliberate:not(.dl-open) #speech,
      #deliberate:not(.dl-open) #say {
        display: none;
      }
      #deliberate #speech {
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        color: #e6e6e6;
        background: #0b0d10;
        border: 1px solid #33414f;
        border-radius: 6px;
        resize: vertical;
      }
      #deliberate #speech:focus {
        outline: none;
        border-color: #9fd0ff;
      }
      #deliberate #say {
        margin-top: 6px;
        width: 100%;
        padding: 5px 0;
        font: inherit;
        color: #0b0d10;
        background: #c8cdd3;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #deliberate .dl-staged {
        margin-top: 8px;
        color: #9fd0ff;
      }
      /* The waiting indicator. Visible whether or not deliberate mode is open, because a turn
         resolves — and NPCs act — on both paths. Empty text collapses it to nothing. */
      #deliberate .dl-busy:not(:empty) {
        margin-top: 8px;
        padding: 4px 8px;
        color: #ffd79a;
        background: rgba(255, 215, 154, 0.08);
        border-left: 2px solid #ffd79a;
        border-radius: 3px;
        font-variant-numeric: tabular-nums;
      }
      #deliberate .dl-preview {
        margin-top: 6px;
        color: #c8cdd3;
        font-style: italic;
        max-height: 26vh;
        overflow-y: auto;
      }
      #deliberate .dl-reactions {
        margin: 8px 0 0;
        padding-left: 18px;
        color: #d8c48a;
        max-height: 22vh;
        overflow-y: auto;
      }
      #deliberate #go {
        flex: none;
        margin-top: 10px;
        width: 100%;
        padding: 6px 0;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #0b0d10;
        background: #9fd0ff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #deliberate #go:disabled {
        background: #33414f;
        color: #7d8b99;
        cursor: default;
      }
      /* Always visible: ending a turn is how initiative reaches the NPCs, and it is not part of
         the deliberate/preview cycle, so it is not hidden with the rest of the panel. */
      #deliberate #end-turn {
        flex: none;
        margin-top: 8px;
        width: 100%;
        padding: 6px 0;
        font: inherit;
        color: #c8cdd3;
        background: transparent;
        border: 1px solid #33414f;
        border-radius: 6px;
        cursor: pointer;
      }
      #deliberate #end-turn:hover {
        border-color: #9fd0ff;
        color: #e6e6e6;
      }
      #deliberate .dl-narration {
        margin-top: 10px;
        color: #e6e6e6;
        white-space: pre-wrap;
        max-height: 30vh;
        overflow-y: auto;
      }
      #overlay {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .float-number {
        position: absolute;
        left: 0;
        top: 0;
        font-size: 20px;
        font-weight: 700;
        text-shadow: 0 2px 4px #000;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="hud"></div>
    <div id="deliberate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
