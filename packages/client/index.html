<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deliberate</title>
    <style>
      /* Every colour below is a token from `src/palette.ts`, written onto :root at start-up.
         The fallbacks are the dark theme, so the page is never unstyled while the module loads. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--dl-surface, #0b1117);
        color: var(--dl-text, #e8eef4);
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0.9;
        pointer-events: none;
        text-shadow: var(--dl-text-shadow, 0 1px 2px rgba(0, 0, 0, 0.85));
      }
      .hud-label {
        color: var(--dl-text-muted, #8496a8);
        display: inline-block;
        min-width: 66px;
      }
      .hud-hint {
        color: var(--dl-accent, #9fd0ff);
      }
      .hud-error {
        color: var(--dl-damage, #ff6b5a);
      }
      #deliberate {
        position: fixed;
        right: 12px;
        top: 12px;
        width: 280px;
        /* The model writes as much prose as it likes. Without a ceiling the panel grows past the
           viewport and pushes GO off the bottom of the screen, which is unreachable rather than
           merely ugly. Bound the panel, and let the text blocks inside it scroll. */
        /* Stops clear of `#ways` at the bottom of the same column (ALE-51). */
        max-height: calc(68vh - 12px);
        display: flex;
        flex-direction: column;
        font-size: 13px;
        line-height: 1.5;
        color: var(--dl-text, #e8eef4);
        background: var(--dl-panel, rgba(11, 17, 23, 0.86));
        border: 1px solid var(--dl-panel-edge, #22303d);
        border-radius: 8px;
        padding: 10px 12px;
        text-shadow: var(--dl-text-shadow, 0 1px 2px rgba(0, 0, 0, 0.85));
      }
      #deliberate .dl-toggle {
        display: block;
        color: var(--dl-text-muted, #8496a8);
        cursor: pointer;
        user-select: none;
      }
      #deliberate:not(.dl-open) .dl-staged,
      #deliberate:not(.dl-open) .dl-preview,
      #deliberate:not(.dl-open) .dl-reactions,
      #deliberate:not(.dl-open) #go {
        display: none;
      }
      /* Free player text. Hidden with the rest of the panel when deliberate mode is off, because
         words only mean something when the game master is being consulted. */
      #deliberate:not(.dl-open) #speech,
      #deliberate:not(.dl-open) #say {
        display: none;
      }
      #deliberate #speech {
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        color: var(--dl-text, #e8eef4);
        background: var(--dl-surface, #0b1117);
        border: 1px solid var(--dl-field-edge, #36485a);
        border-radius: 6px;
        resize: vertical;
      }
      #deliberate #speech:focus {
        outline: none;
        border-color: var(--dl-accent, #9fd0ff);
      }
      #deliberate #say {
        margin-top: 6px;
        width: 100%;
        padding: 5px 0;
        font: inherit;
        color: var(--dl-field, #0b1117);
        background: var(--dl-button, #c8d3dd);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      /* The ALE-39 lines. Never hidden with the rest of the panel: with deliberate mode off the
         panel used to collapse to a bare checkbox, which is precisely when the player most needs
         to be told that no game master is being consulted. */
      #deliberate .dl-mode {
        margin-top: 6px;
        color: var(--dl-accent, #9fd0ff);
      }
      #deliberate:not(.dl-open) .dl-mode {
        color: var(--dl-warn, #ffb86b);
        font-weight: 600;
      }
      #deliberate .dl-gm,
      #deliberate .dl-encounter,
      #deliberate .dl-source {
        margin-top: 4px;
        color: var(--dl-text-muted, #8496a8);
        font-size: 12px;
      }
      #deliberate.dl-nogm .dl-gm {
        color: var(--dl-warn, #ffb86b);
      }
      #deliberate .dl-source {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid var(--dl-panel-edge, #22303d);
        color: var(--dl-button, #c8d3dd);
      }
      #deliberate.dl-engine-only .dl-source {
        color: var(--dl-warn, #ffb86b);
      }
      #deliberate .dl-staged {
        margin-top: 8px;
        color: var(--dl-accent, #9fd0ff);
      }
      /* The waiting indicator. Visible whether or not deliberate mode is open, because a turn
         resolves — and NPCs act — on both paths. `dl-waiting` rather than `:not(:empty)`: the box
         now holds the Abandon control as well as the clock, so it is never empty (ALE-52). */
      #deliberate .dl-busy.dl-waiting {
        margin-top: 8px;
        padding: 4px 8px;
        color: var(--dl-select, #ffd166);
        background: color-mix(in srgb, var(--dl-select, #ffd166) 12%, transparent);
        border-left: 2px solid var(--dl-select, #ffd166);
        border-radius: 3px;
        font-variant-numeric: tabular-nums;
      }
      /* Offered only while a *preview* is in flight — the phase that runs on a clone and commits
         nothing. After GO the panel does not show it, because stopping a turn mid-resolve would
         leave the world half-changed and the server refuses. */
      #deliberate #abandon {
        display: block;
        margin-top: 4px;
        padding: 2px 6px;
        font: inherit;
        font-size: 12px;
        color: var(--dl-select, #ffd166);
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--dl-select, #ffd166) 45%, transparent);
        border-radius: 4px;
        cursor: pointer;
      }
      #deliberate #abandon[hidden] {
        display: none;
      }
      /* A note the player's own cancel put here: neither the game master's prose (italic) nor a
         refusal (the HUD's error line). */
      #deliberate .dl-preview.dl-abandoned {
        color: var(--dl-text-muted, #8496a8);
        font-style: normal;
      }
      #deliberate .dl-preview {
        margin-top: 6px;
        color: var(--dl-button, #c8d3dd);
        font-style: italic;
        max-height: 20vh;
        overflow-y: auto;
      }
      #deliberate .dl-reactions {
        margin: 8px 0 0;
        padding-left: 18px;
        color: var(--dl-warn, #ffb86b);
        max-height: 16vh;
        overflow-y: auto;
      }
      #deliberate #go {
        flex: none;
        margin-top: 10px;
        width: 100%;
        padding: 6px 0;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--dl-field, #0b1117);
        background: var(--dl-accent, #9fd0ff);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #deliberate #go:disabled {
        background: var(--dl-field-edge, #36485a);
        color: var(--dl-text-muted, #8496a8);
        cursor: default;
      }
      /* Always visible: ending a turn is how initiative reaches the NPCs, and Wait is the same
         move outside an encounter — neither is part of the deliberate/preview cycle, so neither
         is hidden with the rest of the panel. */
      #deliberate #end-turn,
      #deliberate #wait {
        flex: none;
        margin-top: 8px;
        width: 100%;
        padding: 6px 0;
        font: inherit;
        color: var(--dl-button, #c8d3dd);
        background: transparent;
        border: 1px solid var(--dl-field-edge, #36485a);
        border-radius: 6px;
        cursor: pointer;
      }
      #deliberate #wait {
        margin-top: 4px;
      }
      #deliberate #end-turn:hover,
      #deliberate #wait:hover {
        border-color: var(--dl-accent, #9fd0ff);
        color: var(--dl-text, #e8eef4);
      }
      /* The dialogue thread (ALE-35). Its own region, on the empty left edge, because a growing
         transcript in the control column on the right is what forced every max-height in this
         file — and a capped transcript is one nobody can read back. `thread.ts` has the argument.
         It is sandwiched between the two other left-edge overlays: clear of the turn-order strip
         when there is an encounter (hence the sibling selector), and clear of the HUD readout at
         the bottom, which runs to seven lines with a hint and a refusal on it. */
      #dialogue {
        position: fixed;
        left: 12px;
        top: 12px;
        /* Height follows the conversation and stops at the HUD readout, which runs to seven lines
           with a hint and a refusal on it. A ceiling rather than a fixed box: two lines of
           dialogue should not draw an empty column the height of the screen, and two hundred
           should not push anything off the bottom of it. */
        max-height: calc(100vh - 168px);
        width: 340px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--dl-text, #e8eef4);
        background: var(--dl-panel, rgba(11, 17, 23, 0.86));
        border: 1px solid var(--dl-panel-edge, #22303d);
        border-radius: 8px;
        text-shadow: var(--dl-text-shadow, 0 1px 2px rgba(0, 0, 0, 0.85));
      }
      #initiative:not([hidden]) ~ #dialogue {
        top: 76px;
        max-height: calc(100vh - 232px);
      }
      /* Collapsed: the header only, so the board can be reclaimed mid-fight without losing the
         conversation. `width()` reports 0 in this state and the board recentres accordingly. */
      #dialogue.is-collapsed .dl-thread-list,
      #dialogue.is-collapsed .dl-thread-jump {
        display: none;
      }
      #dialogue .dl-thread-title {
        flex: none;
        padding: 7px 10px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-align: left;
        color: var(--dl-text-muted, #8496a8);
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--dl-panel-edge, #22303d);
        cursor: pointer;
      }
      #dialogue.is-collapsed .dl-thread-title {
        border-bottom: 0;
      }
      #dialogue .dl-thread-title:hover {
        color: var(--dl-text, #e8eef4);
      }
      #dialogue .dl-thread-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 2px 10px 10px;
      }
      /* Only while you have scrolled back. Following the conversation needs no button. */
      #dialogue .dl-thread-jump {
        position: absolute;
        right: 12px;
        bottom: 8px;
        padding: 3px 9px;
        font: inherit;
        font-size: 11px;
        color: var(--dl-field, #0b1117);
        background: var(--dl-accent, #9fd0ff);
        border: 0;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        cursor: pointer;
      }
      /* One spoken line: a portrait slot, the speaker, and what they said. */
      #dialogue .dl-line {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      /* Your own side of the conversation, facing the other way — which is the whole reason a
         thread reads as a conversation and a log does not. */
      #dialogue .dl-line.is-self {
        flex-direction: row-reverse;
      }
      #dialogue .dl-line.is-pending {
        opacity: 0.55;
      }
      #dialogue .dl-line.is-pending .dl-said::after {
        content: ' …';
      }
      /* The portrait slot. Placeholder initials over the faction colour until there is art; a real
         portrait is a background-image on this same box and moves nothing. */
      #dialogue .dl-portrait {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--dl-speaker, currentColor);
        background-color: color-mix(in srgb, var(--dl-speaker, currentColor) 16%, transparent);
        background-size: cover;
        background-position: center;
        border: 1px solid color-mix(in srgb, var(--dl-speaker, currentColor) 55%, transparent);
        overflow: hidden;
      }
      #dialogue .dl-body {
        flex: 1;
        min-width: 0;
      }
      #dialogue .dl-who {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--dl-speaker, currentColor);
      }
      #dialogue .dl-to {
        margin-left: 5px;
        font-weight: 400;
        color: var(--dl-text-muted, #8496a8);
      }
      /* inline-block so the bubble hugs what was said rather than the column: a one-line remark
         reads as a remark. `text-align` is reset inside it because prose is read from the left
         even when the bubble it sits in is pinned to the right. */
      #dialogue .dl-said {
        display: inline-block;
        box-sizing: border-box;
        max-width: 100%;
        margin: 2px 0 0;
        padding: 5px 8px;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-left: 2px solid var(--dl-speaker, currentColor);
        border-radius: 0 6px 6px 0;
        background: color-mix(in srgb, var(--dl-speaker, currentColor) 9%, transparent);
      }
      #dialogue .is-self .dl-body {
        text-align: right;
      }
      #dialogue .is-self .dl-said {
        border-left: 0;
        border-right: 2px solid var(--dl-speaker, currentColor);
        border-radius: 6px 0 0 6px;
      }
      /* Scene prose. No portrait, no name, no side — stage direction rather than someone talking,
         which is the distinction the old single narration box could not make. */
      #dialogue .dl-scene {
        margin: 12px 0 2px;
        padding: 8px 4px;
        color: var(--dl-text-muted, #8496a8);
        font-style: italic;
        text-align: center;
        white-space: pre-wrap;
        border-top: 1px solid var(--dl-panel-edge, #22303d);
        border-bottom: 1px solid var(--dl-panel-edge, #22303d);
      }
      /* Ways out of here (ALE-51). Bottom of the right-hand column, under the controls, because
         "where can I go from here" is a standing question about the map rather than a transient
         hint — the player who filed this walked the whole perimeter and concluded they were boxed
         in. `#deliberate` gives up the bottom third of the column for it; its prose blocks already
         scroll internally, so what it loses is empty space and not content. */
      #ways {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 280px;
        box-sizing: border-box;
        max-height: 30vh;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.45;
        color: var(--dl-text, #e8eef4);
        background: var(--dl-panel, rgba(11, 17, 23, 0.86));
        border: 1px solid var(--dl-panel-edge, #22303d);
        border-radius: 8px;
        padding: 8px 10px 10px;
        text-shadow: var(--dl-text-shadow, 0 1px 2px rgba(0, 0, 0, 0.85));
      }
      #ways .way-title {
        color: var(--dl-text-muted, #8496a8);
        font-size: 12px;
        letter-spacing: 0.05em;
      }
      #ways .way-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        width: 100%;
        margin-top: 7px;
        padding: 5px 6px;
        font: inherit;
        text-align: left;
        color: inherit;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
      }
      #ways .way-row:hover {
        background: color-mix(in srgb, currentColor 8%, transparent);
      }
      /* You are standing on this one, so it is the only one you can act on this instant. */
      #ways .way-row.is-here {
        border-color: currentColor;
      }
      #ways .way-row.is-exit {
        color: var(--dl-exit, #3ff0a3);
      }
      #ways .way-row.is-frontier {
        color: var(--dl-frontier, #e7eef5);
      }
      /* The legend. Exactly what the board draws: a closed ring is a door to somewhere that
         exists, a broken one is an edge nothing has been written past. Shape first, so it reads
         in greyscale and in both themes. */
      #ways .way-glyph {
        flex: none;
        width: 13px;
        height: 13px;
        margin-top: 3px;
        border-radius: 50%;
        border: 2px solid currentColor;
      }
      #ways .way-row.is-frontier .way-glyph {
        border-style: dashed;
      }
      #ways .way-body {
        flex: 1;
        min-width: 0;
      }
      #ways .way-label {
        color: var(--dl-text, #e8eef4);
      }
      #ways .way-note {
        color: var(--dl-text-muted, #8496a8);
        font-size: 12px;
      }
      #ways .way-row.is-here .way-note {
        color: inherit;
      }
      /* The ALE-39 mode line for frontiers: with deliberate mode off no model is consulted, so
         this edge cannot be crossed at all. Said out loud rather than failing silently. */
      #ways .way-mode {
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid var(--dl-panel-edge, #22303d);
        color: var(--dl-warn, #ffb86b);
        font-size: 12px;
      }
      /* The turn-order strip (ALE-19). Top-centre, clear of the panel on the right and the HUD at
         the bottom left, because in a fight it is the thing you look at most. Hidden outright
         when there is no encounter: an empty strip would imply an order that does not exist. */
      #initiative {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        align-items: stretch;
        gap: 6px;
        pointer-events: none;
        font-size: 12px;
        text-shadow: var(--dl-text-shadow, 0 1px 2px rgba(0, 0, 0, 0.85));
      }
      #initiative .init-round {
        align-self: center;
        padding-right: 4px;
        color: var(--dl-text-muted, #8496a8);
        letter-spacing: 0.04em;
      }
      #initiative .init-chip {
        min-width: 86px;
        padding: 5px 8px;
        background: var(--dl-panel, rgba(11, 17, 23, 0.86));
        border: 1px solid var(--dl-panel-edge, #22303d);
        border-radius: 6px;
        opacity: 0.75;
      }
      /* Whose turn it is, at a glance: the whole point of the strip. */
      #initiative .init-chip.is-current {
        opacity: 1;
        border-color: var(--dl-select, #ffd166);
        box-shadow: 0 0 0 1px var(--dl-select, #ffd166);
      }
      #initiative .init-chip.is-next {
        opacity: 0.95;
        border-color: var(--dl-field-edge, #36485a);
      }
      #initiative .init-chip.is-down {
        opacity: 0.4;
      }
      #initiative .init-chip.is-down .init-name {
        text-decoration: line-through;
      }
      #initiative .init-name {
        color: var(--dl-text, #e8eef4);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 140px;
      }
      #initiative .init-bar {
        margin: 4px 0 3px;
        height: 3px;
        background: var(--dl-panel-edge, #22303d);
        border-radius: 2px;
        overflow: hidden;
      }
      #initiative .init-fill {
        height: 100%;
        background: var(--dl-good, #6fbf73);
      }
      #initiative .init-chip.is-current .init-fill {
        background: var(--dl-accent, #9fd0ff);
      }
      #initiative .init-note {
        color: var(--dl-text-muted, #8496a8);
        white-space: nowrap;
      }
      #overlay {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .float-number {
        position: absolute;
        left: 0;
        top: 0;
        font-size: 20px;
        font-weight: 700;
        text-shadow: 0 2px 4px #000;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="initiative" hidden></div>
    <div id="dialogue" hidden></div>
    <div id="hud"></div>
    <div id="deliberate"></div>
    <div id="ways" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
