<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deliberate</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0.9;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      .hud-label {
        color: #7d8b99;
        display: inline-block;
        min-width: 66px;
      }
      .hud-hint {
        color: #9fd0ff;
      }
      .hud-error {
        color: #ff8a7a;
      }
      #overlay {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .float-number {
        position: absolute;
        left: 0;
        top: 0;
        font-size: 20px;
        font-weight: 700;
        text-shadow: 0 2px 4px #000;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
