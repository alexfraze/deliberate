[project]
name = "deliberate-gm"
version = "0.1.0"
description = "Deliberate's LLM game master: the agent loop, memory blocks, and prompt assembly."
requires-python = ">=3.12,<3.13"
dependencies = [
  # The GM's HTTP surface. The Node server POSTs /turn and streams the result back to the client.
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # Request/response shapes for the Node<->Python contract, validated at the boundary.
  "pydantic>=2.8",
  # Client for the one door into the engine: POST /gm/tool on the Node server.
  "httpx>=0.27",
  # The Claude API. Sits behind the LLMClient protocol so tests never need credentials.
  "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deliberate_gm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Vendored from ARC-AGI-3 (see VENDORED.md). The process-teardown try/except/pass blocks are
# kept in their original shape so the diff against upstream stays readable.
"src/deliberate_gm/sandbox.py" = ["SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["deliberate_gm"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
